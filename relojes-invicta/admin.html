<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel AURUM TEMPO · Pedidos y CRM</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem("at_tema")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body { background: var(--sup); }
    .adm-cab { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--linea); gap: 12px; flex-wrap: wrap; }
    .adm-tabs { display: flex; gap: 6px; margin: 20px 0; flex-wrap: wrap; }
    .adm-tabs button { padding: 10px 16px; border-radius: 2px; border: 1px solid var(--linea); font-weight: 700; font-size: 13px; color: var(--gris-claro); }
    .adm-tabs button.activo { background: var(--texto); color: var(--bg); border-color: var(--texto); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { padding: 18px; border-radius: 2px; background: var(--carbon); border: 1px solid var(--linea); }
    .kpi small { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); }
    .kpi b { display: block; font-family: var(--f-display); font-size: 40px; font-weight: 400; line-height: 1.1; color: var(--texto); }
    .kpi span { font-size: 12px; color: var(--gris); }
    .tabla-wrap { overflow-x: auto; border: 1px solid var(--linea); border-radius: 2px; background: var(--carbon); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: top; }
    th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gris); font-weight: 800; background: var(--grafito); position: sticky; top: 0; }
    tr:hover td { background: rgba(255,255,255,.02); }
    td .sub { color: var(--gris); font-size: 12px; }
    .sel-estado, .inp { background: var(--negro); border: 1px solid var(--linea); border-radius: 2px; padding: 6px 8px; font-size: 12.5px; width: 100%; }
    .inp:focus, .sel-estado:focus { border-color: var(--oro); outline: none; }
    .est { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .est-nuevo { background: rgba(212,175,55,.18); color: var(--oro-claro); }
    .est-separado { background: rgba(28,61,120,.5); color: #b9cdf5; }
    .est-enviado, .est-en_agencia { background: rgba(255,255,255,.08); }
    .est-entregado { background: rgba(37,211,102,.15); color: #7ee2a0; }
    .est-cancelado { background: rgba(208,20,44,.18); color: #ff8a98; }
    .barra-h { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
    .barra-h .b { height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--oro), var(--oro-osc)); }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .herr { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .herr input { flex: 1 1 220px; }
    .mini-btn { padding: 7px 11px; border-radius: 2px; border: 1px solid var(--linea); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .mini-btn:hover { border-color: var(--oro); color: var(--oro-claro); }
    .mini-btn.wsp { border-color: rgba(37,211,102,.4); color: #7ee2a0; }
    .aviso { padding: 12px 16px; border-radius: 2px; background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.35); font-size: 13px; margin-top: 16px; }
    .login { max-width: 400px; margin: 12vh auto; padding: 30px; border-radius: 2px; background: var(--carbon); border: 1px solid var(--linea); }
    .login .campo { margin-bottom: 12px; }
    .etq { display: inline-block; padding: 2px 7px; border-radius: 2px; background: var(--navy); color: #fff; font-size: 11px; margin: 0 4px 4px 0; }
    @media (max-width: 800px) { .dos { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="adm-cab">
      <a href="index.html" class="logo"><span class="logo-texto">AURUM TEMPO<small>PANEL · PEDIDOS Y CRM</small></span></a>
      <div style="display:flex;gap:8px;align-items:center"><span id="usuario" class="sub" style="color:var(--gris);font-size:13px"></span><button class="mini-btn" id="btn-salir" hidden>Cerrar sesión</button><a class="mini-btn" href="index.html">Ver tienda ↗</a></div>
    </div>
    <div id="app"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
